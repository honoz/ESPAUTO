    <style>
        :root {
            --bg-base: #F5F5F5;
            --bg-surface: rgba(255, 255, 255, 0.72);
            --bg-surface-solid: #FFFFFF;
            --bg-card-active: rgba(0, 0, 0, 0.04);
            --bg-video: #000000;

            --brand-primary: #0A59F7;
            --brand-primary-light: rgba(10, 89, 247, 0.10);
            --brand-glow: rgba(10, 89, 247, 0.30);
            --status-success: #00B578;
            --status-success-light: rgba(0, 181, 120, 0.10);
            --status-danger: #FF3B30;
            --status-danger-light: rgba(255, 59, 48, 0.10);
            --status-warning: #FF9500;

            --text-title: #000000;
            --text-body: #1A1A1A;
            --text-caption: #999999;
            --text-on-primary: #FFFFFF;

            --divider: rgba(0, 0, 0, 0.06);
            --border-subtle: rgba(0, 0, 0, 0.04);

            --radius-card: 24px;
            --radius-sub: 16px;
            --radius-capsule: 100px;

            --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.06);
            --shadow-card-hover: 0 4px 24px rgba(0, 0, 0, 0.10);
            --shadow-primary: 0 4px 20px var(--brand-glow);

            --blur-amount: 30px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #000000;
                --bg-surface: rgba(28, 28, 30, 0.72);
                --bg-surface-solid: #1C1C1E;
                --bg-card-active: rgba(255, 255, 255, 0.06);
                --bg-video: #000000;

                --brand-primary: #0A59F7;
                --brand-primary-light: rgba(10, 89, 247, 0.15);
                --brand-glow: rgba(10, 89, 247, 0.40);
                --status-success: #30D158;
                --status-success-light: rgba(48, 209, 88, 0.15);
                --status-danger: #FF453A;
                --status-danger-light: rgba(255, 69, 58, 0.15);
                --status-warning: #FF9F0A;

                --text-title: #FFFFFF;
                --text-body: #E5E5EA;
                --text-caption: #8E8E93;
                --text-on-primary: #FFFFFF;

                --divider: rgba(255, 255, 255, 0.08);
                --border-subtle: rgba(255, 255, 255, 0.04);

                --shadow-card: 0 2px 20px rgba(0, 0, 0, 0.40);
                --shadow-card-hover: 0 8px 32px rgba(0, 0, 0, 0.50);
                --shadow-primary: 0 4px 24px var(--brand-glow);
            }
        }

        body {
            font-family: "HarmonyOS Sans", "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            background: var(--bg-surface);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-bottom: 0.5px solid var(--divider);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-title);
        }

        .logo-badge {
            background: var(--brand-primary-light);
            color: var(--brand-primary);
            font-size: 10px;
            padding: 3px 10px;
            border-radius: var(--radius-capsule);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #headerClock {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-caption);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .btn-lang {
            background: var(--bg-card-active);
            border: none;
            color: var(--text-body);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-lang:hover {
            background: var(--brand-primary-light);
            color: var(--brand-primary);
        }

        .main-wrapper {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid var(--divider);
            border-radius: var(--radius-card);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.3s ease;
        }

        .panel:hover {
            box-shadow: var(--shadow-card-hover);
        }

        .video-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: var(--bg-video);
            border-radius: var(--radius-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #videoDisplayCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .no-video {
            color: var(--text-caption);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            padding: 0 10px;
        }

        .no-video-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-card-active);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-caption);
            border: 0.5px solid var(--divider);
        }

        .rec-indicator {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.60);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: var(--radius-capsule);
            font-size: 11px;
            font-weight: 600;
            color: #FFFFFF;
            display: none;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .rec-dot {
            width: 7px;
            height: 7px;
            background-color: var(--status-danger);
            border-radius: 50%;
            animation: rec-pulse 1.2s infinite;
        }

        @keyframes rec-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn-group {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            font-family: inherit;
            background: var(--bg-card-active);
            color: var(--text-title);
            border: none;
            padding: 0 16px;
            height: 48px;
            box-sizing: border-box;
            border-radius: var(--radius-sub);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .btn:hover::after { opacity: 0.06; }
        .btn:active::after { opacity: 0.12; }
        .btn:active:not(:disabled) { transform: scale(0.97); }

        .btn-primary {
            background: var(--brand-primary);
            color: var(--text-on-primary);
            box-shadow: var(--shadow-primary);
        }

        .btn-primary::after { display: none; }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .btn-disconnect {
            background: var(--status-danger-light);
            color: var(--status-danger);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn:disabled::after { display: none; }

        .panel-control-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .dashboard-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-title);
            margin: 0 0 20px 0;
            letter-spacing: 0.3px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .status-card {
            background: var(--bg-card-active);
            border-radius: var(--radius-sub);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            transition: background 0.2s ease;
        }

        .status-card:hover {
            background: var(--brand-primary-light);
        }

        .status-label {
            font-size: 11px;
            color: var(--text-caption);
            font-weight: 500;
            white-space: nowrap;
        }

        .status-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .slider-section {
            background: var(--bg-card-active);
            border-radius: var(--radius-sub);
            padding: 16px;
            margin-bottom: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-body);
            margin-bottom: 14px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 40px;
            border-radius: var(--radius-capsule);
            background: var(--bg-card-active);
            overflow: hidden;
        }

        input[type=range].modern-slider {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            margin: 0; opacity: 0;
            cursor: ew-resize;
            z-index: 5;
        }

        .slider-track-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            min-width: 40px;
            background: transparent;
            border-radius: var(--radius-capsule);
            pointer-events: none;
            transition: width 0.15s ease;
        }

        .slider-thumb {
            position: absolute;
            top: 50%;
            right: 4px;
            width: 32px;
            height: 32px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 3;
            transition: box-shadow 0.2s ease;
        }

        .slider-thumb.active {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .mobile-joystick-zone {
            display: none;
            background: var(--bg-card-active);
            border-radius: var(--radius-card);
            padding: 24px;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .joystick-container {
            width: 148px;
            height: 148px;
            background: var(--bg-card-active);
            border: 2px solid var(--divider);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-thumb {
            width: 52px;
            height: 52px;
            background: var(--brand-primary);
            box-shadow: var(--shadow-primary);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .mobile-action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }
        .mobile-action-grid .btn {
            height: 48px;
            font-size: 12px;
            padding: 0 4px;
        }

        .guide-card {
            background: var(--bg-card-active);
            border-radius: var(--radius-sub);
            padding: 20px 24px;
            font-size: 13px;
            color: var(--text-caption);
            line-height: 1.9;
            min-height: 165px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            margin-top: auto;
        }

        .guide-card h4 {
            margin: 0 0 12px 0;
            color: var(--text-title);
            font-size: 14px;
            font-weight: 600;
        }

        .guide-list {
            margin: 0 0 12px 0;
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guide-list li {
            color: var(--text-body);
        }

        .tip-highlight {
            color: var(--status-warning);
            display: block;
            font-style: normal;
            font-size: 12px;
            font-weight: 500;
            border-top: 0.5px solid var(--divider);
            padding-top: 12px;
        }

        @media (max-width: 1024px) {
            .main-wrapper {
                grid-template-columns: 1fr;
                padding: 14px;
                gap: 16px;
            }
            .panel {
                padding: 18px;
                border-radius: 20px;
            }
            .guide-card.pc-only { display: none; }

            .btn-group #btnConnect { flex: 1 !important; }
            .btn-group #btnDisconnect { flex: 1 !important; }
            .btn { font-size: 13px; }
            .status-value { font-size: 17px; }
        }

        @media (max-width: 360px) {
            .btn {
                font-size: 11px;
                padding: 0 6px;
                height: 44px;
            }
            .status-value { font-size: 14px; }
            .panel { padding: 14px; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-box {
            background: var(--bg-surface-solid);
            border-radius: var(--radius-card);
            padding: 32px 28px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.18);
            text-align: center;
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--status-danger-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: var(--status-danger);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-title);
            margin: 0 0 10px 0;
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-caption);
            line-height: 1.7;
            margin: 0 0 24px 0;
            text-align: start;
        }

        .modal-btn {
            font-family: inherit;
            background: var(--brand-primary);
            color: var(--text-on-primary);
            border: none;
            padding: 0 32px;
            height: 44px;
            border-radius: var(--radius-capsule);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition-smooth);
        }

        .modal-btn:hover {
            filter: brightness(1.08);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <span class="logo-title">ESPAUTO</span>
        <span class="logo-badge">v1.1</span>
    </div>
    <div class="header-right">
        <div id="headerClock" data-i18n="statusStandby">DEVICE STANDBY</div>
        <button id="btnLangToggle" class="btn-lang">EN</button>
    </div>
</header>

<div class="main-wrapper">
    <div class="panel">
        <div class="video-box">
            <div id="recIndicator" class="rec-indicator">
                <div class="rec-dot"></div>
                <span>REC <span id="recTimer">00:00</span></span>
            </div>
            <canvas id="videoDisplayCanvas"></canvas>
            <div id="noVideoTip" class="no-video">
                <div class="no-video-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="M23 7l-7 5 7 5V7z"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                </div>
                <span data-i18n="videoTip">等待无线图传建立...</span>
            </div>
        </div>

        <div id="mobileJoystickZone" class="mobile-joystick-zone">
            <div id="joystickContainer" class="joystick-container">
                <div id="joystickThumb" class="joystick-thumb"></div>
            </div>
            <div class="mobile-action-grid">
                <button id="mBtnServoUp" class="btn mob-action-btn" data-i18n="btnTiltUp" disabled>
                    云台 抬起
                </button>
                <button id="mBtnBeep" class="btn mob-action-btn" data-i18n="btnBeep" disabled>鸣笛
                </button>
                <button id="mBtnServoDown" class="btn mob-action-btn" data-i18n="btnTiltDown"
                        disabled>云台 降下
                </button>
            </div>
        </div>

        <div class="btn-group">
            <button id="btnConnect" class="btn btn-primary" style="flex: 1.4;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
                </svg>
                <span data-i18n="btnConnect">建立连接</span>
            </button>
            <button id="btnDisconnect" class="btn btn-disconnect" style="flex: 0.6;" disabled
                    data-i18n="btnDisconnect">断开
            </button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-control-inner">
            <h3 class="dashboard-title" data-i18n="dashTitle">系统状态与控制</h3>

            <div class="status-grid">
                <div class="status-card">
                    <span class="status-label" data-i18n="lblLink">连接状态</span>
                    <span id="txtState" class="status-value"
                          style="color: var(--status-danger); font-size: 14px;" data-i18n="statusOffline">OFFLINE</span>
                </div>
                <div class="status-card">
                    <span class="status-label" data-i18n="lblFps">实时帧率</span>
                    <span id="txtFps" class="status-value" style="color: var(--brand-primary);">-- FPS</span>
                </div>
                <div class="status-card">
                    <span class="status-label" data-i18n="lblTemp">终端温度</span>
                    <span id="txtTemp" class="status-value">-- ℃</span>
                </div>
                <div class="status-card">
                    <span class="status-label" data-i18n="lblBright">照明功率</span>
                    <span id="txtBright" class="status-value">-- %</span>
                </div>
            </div>

            <div class="slider-section">
                <div class="slider-header">
                    <span data-i18n="sliderLed">灯光控制</span>
                    <span id="sliderValDisplay">0%</span>
                </div>
                <div class="slider-container">
                    <div id="sliderTrackFill" class="slider-track-fill">
                        <div id="sliderThumb" class="slider-thumb"></div>
                    </div>
                    <input type="range" id="sliderLed" class="modern-slider" min="0" max="100"
                           value="0" disabled>
                </div>
            </div>

            <div class="btn-group" style="margin-top: 0; margin-bottom: 24px;">
                <button id="btnBeep" class="btn pc-action-btn" disabled data-i18n="btnBeep">鸣笛
                </button>
                <button id="btnScreenshot" class="btn" disabled data-i18n="btnSnap">快照</button>
                <button id="btnRecord" class="btn" disabled style="flex: 1.2;">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"
                         id="iconRecord" style="color: var(--status-danger);">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                    <span id="lblRecord" style="margin-left: 2px;" data-i18n="btnRecord">录制</span>
                </button>
            </div>

            <div class="guide-card pc-only" id="pcGuideCard">
                <h4 data-i18n="guideTitle">操控集群说明:</h4>
                <ul class="guide-list">
                    <li id="g_move"><b>车身移动</b>：W (前) / S (后) / A (左旋) / D (右旋)</li>
                    <li id="g_servo"><b>精密云台</b>：I (抬起) / K (降下)</li>
                    <li id="g_beep"><b>应答模块</b>：Space (短促鸣笛)</li>
                </ul>
                <i class="tip-highlight">
                    <span data-i18n="guideTip">提示：遥控前请点击网页任意空白处激活焦点。</span>
                </i>
            </div>
        </div>
    </div>
</div>

<canvas id="recordCanvas" style="display: none;"></canvas>

<div id="bleNotSupportedModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h3 class="modal-title" data-i18n="modalBleNotSupportTitle">浏览器不支持</h3>
        <p class="modal-message" data-i18n="modalBleNotSupportMsg">当前浏览器不支持蓝牙功能，请改用 Chrome 或 Edge 浏览器打开本页面。</p>
        <button class="modal-btn" id="btnModalClose" data-i18n="modalClose">确定</button>
    </div>
</div>

<script>
    const i18nTokens = {
        'zh-CN': {
            statusStandby: "设备就绪",
            statusSearching: "正在搜索",
            statusLinking: "正在配对",
            statusActive: "系统就绪",
            statusError: "连接异常",
            statusOnline: "已连接",
            statusOffline: "未连接",
            videoTip: "等待无线图传建立...",
            btnConnect: "建立连接",
            btnDisconnect: "断开",
            dashTitle: "系统状态与控制",
            lblLink: "连接状态",
            lblFps: "实时帧率",
            lblTemp: "终端温度",
            lblBright: "照明功率",
            sliderLed: "灯光控制",
            btnBeep: "鸣笛",
            btnSnap: "快照",
            btnRecord: "录制",
            btnRecordStop: "停止",
            btnTiltUp: "云台 抬起",
            btnTiltDown: "云台 降下",
            guideTitle: "操控集群说明:",
            g_move: "<b>车身移动</b>：W (前) / S (后) / A (左旋) / D (右旋)",
            g_servo: "<b>精密云台</b>：I (抬起) / K (降下)",
            g_beep: "<b>应答模块</b>：Space (短促鸣笛)",
            guideTip: "提示：遥控前请点击网页任意空白处激活焦点。",
            modalBleNotSupportTitle: "浏览器不支持",
            modalBleNotSupportMsg: "当前浏览器不支持蓝牙功能，请改用 Chrome 或 Edge 浏览器打开本页面。",
            modalClose: "确定"
        },
        'en': {
            statusStandby: "DEVICE STANDBY",
            statusSearching: "SEARCHING",
            statusLinking: "PAIRING",
            statusActive: "SYSTEM ACTIVE",
            statusError: "CONNECTION ERROR",
            statusOnline: "ONLINE",
            statusOffline: "OFFLINE",
            videoTip: "Establishing wireless video link...",
            btnConnect: "Connect",
            btnDisconnect: "Disconnect",
            dashTitle: "System Status & Control",
            lblLink: "Connection",
            lblFps: "Real-time FPS",
            lblTemp: "Device Temp",
            lblBright: "LED Power",
            sliderLed: "Light Control",
            btnBeep: "Horn",
            btnSnap: "Snapshot",
            btnRecord: "Record",
            btnRecordStop: "Stop",
            btnTiltUp: "Tilt Up",
            btnTiltDown: "Tilt Down",
            guideTitle: "Cluster Control Guide:",
            g_move: "<b>Chassis</b>: W (Fwd) / S (Bwd) / A (Left) / D (Right)",
            g_servo: "<b>Gimbal</b>: I (Tilt Up) / K (Tilt Down)",
            g_beep: "<b>Response Module</b>: Space (Short Honk)",
            guideTip: "Tip: Click anywhere blank to focus keyboard control.",
            modalBleNotSupportTitle: "Browser Not Supported",
            modalBleNotSupportMsg: "Your browser does not support Bluetooth. Please open this page in Chrome or Edge instead.",
            modalClose: "OK"
        }
    };

    let currentLang = navigator.language.startsWith('zh') ? 'zh-CN' : 'en';

    function applyLanguage(lang) {
        currentLang = lang;
        document.getElementById('btnLangToggle').innerText = lang === 'zh-CN' ? 'EN' : '中文';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const token = el.getAttribute('data-i18n');
            if (i18nTokens[lang][token]) el.innerText = i18nTokens[lang][token];
        });

        document.getElementById('g_move').innerHTML = i18nTokens[lang]['g_move'];
        document.getElementById('g_servo').innerHTML = i18nTokens[lang]['g_servo'];
        document.getElementById('g_beep').innerHTML = i18nTokens[lang]['g_beep'];

        updateStateTextUI();
    }

    const BLE_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
    const CONTROL_CHAR_UUID = "0000ffe2-0000-1000-8000-00805f9b34fb";
    const VIDEO_CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
    const STATUS_CHAR_UUID = "0000ffe3-0000-1000-8000-00805f9b34fb";

    const CMD_LED_BRIGHTNESS = 0x00;
    const CMD_BEEP = 0x12;
    const CMD_SERVO_UP = 0x13;
    const CMD_SERVO_DOWN = 0x14;
    const CMD_CAR_MOVE = 0x15;

    let bleDevice = null, gattServer = null, controlCharacteristic = null;
    let bleCmdQueue = [], isSendingCmd = false;
    const CMD_SEND_INTERVAL_MS = 15;

    let isFirstStatusReceived = false;
    let frameChunks = [];
    let videoBufferReceivedLen = 0, expectFrameTotalLen = 0;
    let frameCountFps = 0, lastFpsRefreshTime = Date.now();
    let latestImageBitmap = null;

    let keyStates = { w: false, s: false, a: false, d: false };
    let driveLoopIntervalId = null, servoIntervalId = null, statusPollIntervalId = null;
    let lastSentSpeed = 0, lastSentSteer = 0;

    let mediaRecorder = null, recordedChunks = [], isRecording = false;
    let recordCanvasId = null, recordStartTime = 0, recordTimerInterval = null;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const videoDisplayCanvas = document.getElementById('videoDisplayCanvas');
    const canvasDisplayCtx = videoDisplayCanvas.getContext('2d');
    const noVideoTip = document.getElementById('noVideoTip');
    const txtState = document.getElementById('txtState');
    const txtFps = document.getElementById('txtFps');
    const txtTemp = document.getElementById('txtTemp');
    const txtBright = document.getElementById('txtBright');
    const sliderLed = document.getElementById('sliderLed');
    const sliderTrackFill = document.getElementById('sliderTrackFill');
    const sliderThumb = document.getElementById('sliderThumb');
    const sliderValDisplay = document.getElementById('sliderValDisplay');
    const btnBeep = document.getElementById('btnBeep');
    const btnScreenshot = document.getElementById('btnScreenshot');
    const btnRecord = document.getElementById('btnRecord');
    const lblRecord = document.getElementById('lblRecord');
    const recIndicator = document.getElementById('recIndicator');
    const recTimer = document.getElementById('recTimer');
    const recordCanvas = document.getElementById('recordCanvas');
    const canvasCtx = recordCanvas.getContext('2d');

    const mobileJoystickZone = document.getElementById('mobileJoystickZone');
    const joystickContainer = document.getElementById('joystickContainer');
    const joystickThumb = document.getElementById('joystickThumb');
    const mBtnServoUp = document.getElementById('mBtnServoUp');
    const mBtnServoDown = document.getElementById('mBtnServoDown');
    const mBtnBeep = document.getElementById('mBtnBeep');
    const pcGuideCard = document.getElementById('pcGuideCard');
    const bleNotSupportedModal = document.getElementById('bleNotSupportedModal');
    const btnModalClose = document.getElementById('btnModalClose');

    btnModalClose.addEventListener('click', () => {
        bleNotSupportedModal.classList.remove('visible');
    });
    bleNotSupportedModal.addEventListener('click', (e) => {
        if (e.target === bleNotSupportedModal) bleNotSupportedModal.classList.remove('visible');
    });

    let isMobileMode = false;

    function checkAndSwitchEnvironment() {
        const isSmallScreen = window.innerWidth <= 1024;
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const isTouchMediaQuery = window.matchMedia("(pointer: coarse)").matches;
        const targetIsMobile = isSmallScreen || hasTouch || isTouchMediaQuery;

        if (targetIsMobile !== isMobileMode) {
            isMobileMode = targetIsMobile;
            if (isMobileMode) {
                mobileJoystickZone.style.display = 'flex';
                btnBeep.style.display = 'none';
                pcGuideCard.style.display = 'none';
                stopDriveLoop();
            } else {
                mobileJoystickZone.style.display = 'none';
                btnBeep.style.display = 'inline-flex';
                pcGuideCard.style.display = 'flex';
                if (bleDevice && bleDevice.gatt.connected) startDriveLoop();
            }
        }
    }

    window.addEventListener('resize', checkAndSwitchEnvironment);
    window.addEventListener('orientationchange', checkAndSwitchEnvironment);
    checkAndSwitchEnvironment();
    window.addEventListener('touchstart', () => { if(!isMobileMode) checkAndSwitchEnvironment(); }, {once: true});

    const preventControlFocus = (e) => {
        setTimeout(() => { if(document.activeElement) document.activeElement.blur(); }, 5);
    };

    function updateSliderUI(value) {
        sliderTrackFill.style.width = value + '%';
        sliderTrackFill.style.background = value > 0 ? 'var(--brand-primary)' : 'transparent';
    }

    function updateStateTextUI() {
        if(!bleDevice || !bleDevice.gatt.connected) {
            const searching = i18nTokens[currentLang]['statusSearching'];
            const linking = i18nTokens[currentLang]['statusLinking'];
            const error = i18nTokens[currentLang]['statusError'];
            if(txtState.innerText !== searching && txtState.innerText !== linking && txtState.innerText !== error) {
                txtState.innerText = i18nTokens[currentLang]['statusOffline'];
                txtState.style.color = "var(--status-danger)";
            }
        } else {
            txtState.innerText = i18nTokens[currentLang]['statusOnline'];
            txtState.style.color = "var(--status-success)";
        }
    }

    document.getElementById('btnLangToggle').addEventListener('click', () => {
        applyLanguage(currentLang === 'zh-CN' ? 'en' : 'zh-CN');
    });

    btnConnect.addEventListener('click', (e) => { connectBle(); preventControlFocus(e); });
    btnDisconnect.addEventListener('click', (e) => { disconnectBle(); preventControlFocus(e); });
    btnBeep.addEventListener('click', (e) => { sendSimpleControlCmd(CMD_BEEP); preventControlFocus(e); });
    btnScreenshot.addEventListener('click', (e) => { saveScreenshot(); preventControlFocus(e); });
    btnRecord.addEventListener('click', (e) => { toggleVideoRecording(); preventControlFocus(e); });

    sliderLed.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        txtBright.innerText = val + "%";
        sliderValDisplay.innerText = val + "%";
        updateSliderUI(val);
        sendLedBrightCmd(val);
    });

    sliderLed.addEventListener('mousedown', () => sliderThumb.classList.add('active'));
    sliderLed.addEventListener('mouseup', () => sliderThumb.classList.remove('active'));
    sliderLed.addEventListener('touchstart', () => sliderThumb.classList.add('active'), { passive: true });
    sliderLed.addEventListener('touchend', () => sliderThumb.classList.remove('active'));

    mBtnBeep.addEventListener('touchstart', (e) => { e.preventDefault(); sendSimpleControlCmd(CMD_BEEP); });

    mBtnServoUp.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sendSimpleControlCmd(CMD_SERVO_UP);
        if(servoIntervalId) clearInterval(servoIntervalId);
        servoIntervalId = setInterval(() => sendSimpleControlCmd(CMD_SERVO_UP), 100);
    });
    mBtnServoUp.addEventListener('touchend', (e) => { e.preventDefault(); clearInterval(servoIntervalId); servoIntervalId = null; });

    mBtnServoDown.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sendSimpleControlCmd(CMD_SERVO_DOWN);
        if(servoIntervalId) clearInterval(servoIntervalId);
        servoIntervalId = setInterval(() => sendSimpleControlCmd(CMD_SERVO_DOWN), 100);
    });
    mBtnServoDown.addEventListener('touchend', (e) => { e.preventDefault(); clearInterval(servoIntervalId); servoIntervalId = null; });

    let joystickActive = false;
    let joystickCenterX = 0, joystickCenterY = 0;
    const JOYSTICK_MAX_RADIUS = 48;

    function getJoystickCenter() {
        const rect = joystickContainer.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function updateJoystickThumb(dx, dy) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        const clampedDist = Math.min(dist, JOYSTICK_MAX_RADIUS);
        const angle = Math.atan2(dy, dx);
        const clampedX = Math.cos(angle) * clampedDist;
        const clampedY = Math.sin(angle) * clampedDist;
        joystickThumb.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;
        return { x: clampedX / JOYSTICK_MAX_RADIUS, y: clampedY / JOYSTICK_MAX_RADIUS };
    }

    function resetJoystickThumb() {
        joystickThumb.style.transform = 'translate(-50%, -50%)';
    }

    let joystickSpeed = 0, joystickSteer = 0;
    let joystickLoopId = null;

    function startJoystickDriveLoop() {
        if (joystickLoopId) return;
        joystickLoopId = setInterval(() => {
            if (!controlCharacteristic) return;
            if (joystickSpeed !== 0 || joystickSteer !== 0) {
                sendCarMoveCmd(joystickSpeed, joystickSteer);
                lastSentSpeed = joystickSpeed;
                lastSentSteer = joystickSteer;
            } else {
                if (lastSentSpeed !== 0 || lastSentSteer !== 0) {
                    sendCarMoveCmd(0, 0);
                    lastSentSpeed = 0;
                    lastSentSteer = 0;
                }
            }
        }, 40);
    }

    function stopJoystickDriveLoop() {
        if (joystickLoopId) { clearInterval(joystickLoopId); joystickLoopId = null; }
    }

    joystickContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!controlCharacteristic) return;
        joystickActive = true;
        const center = getJoystickCenter();
        joystickCenterX = center.x;
        joystickCenterY = center.y;
        startJoystickDriveLoop();
    }, { passive: false });

    joystickContainer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!joystickActive) return;
        const touch = e.touches[0];
        const dx = touch.clientX - joystickCenterX;
        const dy = touch.clientY - joystickCenterY;
        const normalized = updateJoystickThumb(dx, dy);
        joystickSteer = Math.round(-normalized.x * 80);
        joystickSpeed = Math.round(normalized.y * 80);
    }, { passive: false });

    function onJoystickEnd(e) {
        e.preventDefault();
        joystickActive = false;
        joystickSpeed = 0;
        joystickSteer = 0;
        resetJoystickThumb();
        stopJoystickDriveLoop();
        if (controlCharacteristic) {
            sendCarMoveCmd(0, 0);
            lastSentSpeed = 0;
            lastSentSteer = 0;
        }
    }

    joystickContainer.addEventListener('touchend', onJoystickEnd, { passive: false });
    joystickContainer.addEventListener('touchcancel', onJoystickEnd, { passive: false });

    setInterval(processNextCmd, CMD_SEND_INTERVAL_MS);

    async function connectBle() {
        if (!navigator.bluetooth) {
            bleNotSupportedModal.classList.add('visible');
            return;
        }
        try {
            txtState.innerText = i18nTokens[currentLang]['statusSearching'];
            txtState.style.color = "#FF9F0A";
            isFirstStatusReceived = false;

            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ manufacturerData: [{ companyIdentifier: 0xE5E5 }] }],
                optionalServices: [BLE_SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            txtState.innerText = i18nTokens[currentLang]['statusLinking'];
            gattServer = await bleDevice.gatt.connect();

            const service = await gattServer.getPrimaryService(BLE_SERVICE_UUID);
            try { controlCharacteristic = await service.getCharacteristic(CONTROL_CHAR_UUID); } catch (e) {}

            try {
                const videoChar = await service.getCharacteristic(VIDEO_CHAR_UUID);
                await videoChar.startNotifications();
                videoChar.addEventListener('characteristicvaluechanged', handleVideoData);
            } catch (e) {}

            try {
                const statusChar = await service.getCharacteristic(STATUS_CHAR_UUID);
                const initValue = await statusChar.readValue();
                handleStatusData({ target: { value: initValue } });

                if (statusPollIntervalId) clearInterval(statusPollIntervalId);
                statusPollIntervalId = setInterval(async () => {
                    if (bleDevice && bleDevice.gatt.connected) {
                        try {
                            const latestValue = await statusChar.readValue();
                            handleStatusData({ target: { value: latestValue } });
                        } catch (readErr) {}
                    } else {
                        clearInterval(statusPollIntervalId);
                    }
                }, 2000);
            } catch (e) {}

            if (controlCharacteristic) {
                txtState.innerText = i18nTokens[currentLang]['statusOnline'];
                txtState.style.color = "var(--status-success)";
                document.getElementById('headerClock').innerText = i18nTokens[currentLang]['statusActive'];
                toggleUiElements(true);
                if (!isMobileMode) startDriveLoop();
            } else {
                throw new Error("Char Error");
            }
        } catch (error) {
            txtState.innerText = i18nTokens[currentLang]['statusError'];
            txtState.style.color = "var(--status-danger)";
            toggleUiElements(false);
        }
    }

    function toggleUiElements(connected) {
        btnConnect.disabled = connected;
        btnDisconnect.disabled = !connected;
        sliderLed.disabled = !connected;
        btnBeep.disabled = !connected;
        btnScreenshot.disabled = !connected;
        btnRecord.disabled = !connected;

        document.querySelectorAll('.mob-action-btn').forEach(btn => btn.disabled = !connected);

        if(!connected) {
            if (isRecording) stopVideoRecording();
            videoDisplayCanvas.style.display = 'none';
            noVideoTip.style.display = 'flex';
            txtFps.innerText = "-- FPS";
            txtTemp.innerText = "-- ℃";
            document.getElementById('headerClock').innerText = i18nTokens[currentLang]['statusStandby'];
            stopDriveLoop();
            if (statusPollIntervalId) { clearInterval(statusPollIntervalId); statusPollIntervalId = null; }
            if (latestImageBitmap) { latestImageBitmap.close(); latestImageBitmap = null; }
        }
    }

    function disconnectBle() {
        if (bleDevice && bleDevice.gatt.connected) {
            forceStopCar();
            bleDevice.gatt.disconnect();
        }
    }

    function onDisconnected() {
        updateStateTextUI();
        toggleUiElements(false);
        stopDriveLoop();
        resetAllKeys();
        isFirstStatusReceived = false;
    }

    function handleVideoData(event) {
        const dataView = event.target.value;
        const data = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
        if (data.length < 2) return;

        if (data.length >= 4 && data[0] === 0xAB && data[1] === 0xCD) {
            expectFrameTotalLen = (data[2] << 8) | data[3];
            videoBufferReceivedLen = 0;
            frameChunks = [];
            return;
        }
        if (expectFrameTotalLen <= 0) return;

        frameChunks.push(data);
        videoBufferReceivedLen += data.length;

        if (videoBufferReceivedLen >= expectFrameTotalLen) {
            const blob = new Blob(frameChunks, { type: 'image/jpeg' });

            createImageBitmap(blob).then(imageBitmap => {
                requestAnimationFrame(() => {
                    if (!bleDevice || !bleDevice.gatt.connected) {
                        imageBitmap.close();
                        return;
                    }

                    if (videoDisplayCanvas.style.display !== 'block') {
                        videoDisplayCanvas.style.display = 'block';
                        noVideoTip.style.display = 'none';
                    }

                    if (videoDisplayCanvas.width !== imageBitmap.width) {
                        videoDisplayCanvas.width = imageBitmap.width;
                        videoDisplayCanvas.height = imageBitmap.height;
                    }

                    canvasDisplayCtx.drawImage(imageBitmap, 0, 0);

                    if (latestImageBitmap) { latestImageBitmap.close(); }
                    latestImageBitmap = imageBitmap;

                    frameCountFps++;
                    const now = Date.now();
                    if (now - lastFpsRefreshTime >= 1000) {
                        txtFps.innerText = `${frameCountFps} FPS`;
                        frameCountFps = 0;
                        lastFpsRefreshTime = now;
                    }
                });
            }).catch(err => {});

            expectFrameTotalLen = 0;
            videoBufferReceivedLen = 0;
            frameChunks = [];
        }
    }

    function handleStatusData(event) {
        try {
            const dataView = event.target.value;
            if (!dataView || dataView.byteLength < 1) return;

            const rawBright = dataView.getUint8(0);
            const brightPercent = Math.round((rawBright / 255) * 100);
            txtBright.innerText = brightPercent + "%";

            if (!isFirstStatusReceived) {
                sliderLed.value = brightPercent;
                sliderValDisplay.innerText = brightPercent + "%";
                updateSliderUI(brightPercent);
                isFirstStatusReceived = true;
            }

            if (dataView.byteLength >= 2) {
                const temp = dataView.getUint8(1);
                txtTemp.innerText = (temp === 0xFF) ? "ERR" : `${temp}℃`;
            }
        } catch (err) {}
    }

    function addCmdToQueue(cmdBytes) {
        if (!controlCharacteristic) return;
        if (bleCmdQueue.length > 2 && cmdBytes[2] === CMD_CAR_MOVE) {
            bleCmdQueue = bleCmdQueue.filter(c => c[2] !== CMD_CAR_MOVE);
        }
        bleCmdQueue.push(cmdBytes);
    }

    async function processNextCmd() {
        if (isSendingCmd || bleCmdQueue.length === 0 || !controlCharacteristic) return;
        isSendingCmd = true;
        const cmd = bleCmdQueue.shift();
        try {
            await controlCharacteristic.writeValue(new Uint8Array(cmd));
        } catch (e) {
        } finally {
            isSendingCmd = false;
        }
    }

    function sendCarMoveCmd(speed, steer) { addCmdToQueue([0xAA, 0xFF, CMD_CAR_MOVE, speed & 0xFF, steer & 0xFF]); }
    function sendLedBrightCmd(bright) {
        const rawBright = Math.round((bright / 100) * 255);
        addCmdToQueue([0xAA, 0xFF, CMD_LED_BRIGHTNESS, rawBright & 0xFF]);
    }
    function sendSimpleControlCmd(cmdCode) { addCmdToQueue([0xAA, 0xFF, cmdCode]); }

    function forceStopCar() {
        const cmd = [0xAA, 0xFF, CMD_CAR_MOVE, 0, 0];
        if (controlCharacteristic) { controlCharacteristic.writeValue(new Uint8Array(cmd)).catch(()=>{}); }
        lastSentSpeed = 0; lastSentSteer = 0;
    }

    function startDriveLoop() {
        stopDriveLoop();
        lastSentSpeed = 0; lastSentSteer = 0;
        driveLoopIntervalId = setInterval(() => {
            let speed = 0; let steer = 0;
            if (keyStates.w) speed = -80;
            if (keyStates.s) speed = 80;
            if (keyStates.a) steer = 80;
            if (keyStates.d) steer = -80;

            if (speed !== 0 || steer !== 0) {
                sendCarMoveCmd(speed, steer);
                lastSentSpeed = speed; lastSentSteer = steer;
            } else {
                if (lastSentSpeed !== 0 || lastSentSteer !== 0) {
                    sendCarMoveCmd(0, 0);
                    lastSentSpeed = 0; lastSentSteer = 0;
                }
            }
        }, 40);
    }

    function stopDriveLoop() { if (driveLoopIntervalId) { clearInterval(driveLoopIntervalId); driveLoopIntervalId = null; } }

    function resetAllKeys() {
        for (let key in keyStates) { keyStates[key] = false; }
        if (servoIntervalId) { clearInterval(servoIntervalId); servoIntervalId = null; }
    }

    window.addEventListener('keydown', (e) => {
        if (!controlCharacteristic || isMobileMode) return;
        const key = e.key.toLowerCase();
        const controlKeys = ['w','s','a','d','i','k',' '];
        if (controlKeys.includes(key)) { e.preventDefault(); }
        if (key in keyStates) { keyStates[key] = true; }

        if (key === 'i' && !servoIntervalId) {
            sendSimpleControlCmd(CMD_SERVO_UP);
            servoIntervalId = setInterval(() => sendSimpleControlCmd(CMD_SERVO_UP), 100);
        } else if (key === 'k' && !servoIntervalId) {
            sendSimpleControlCmd(CMD_SERVO_DOWN);
            servoIntervalId = setInterval(() => sendSimpleControlCmd(CMD_SERVO_DOWN), 100);
        }
        if (e.key === ' ' && !e.repeat) { sendSimpleControlCmd(CMD_BEEP); }
    });

    window.addEventListener('keyup', (e) => {
        if (!controlCharacteristic || isMobileMode) return;
        const key = e.key.toLowerCase();
        if (key in keyStates) { keyStates[key] = false; }
        if (key === 'i' || key === 'k') { clearInterval(servoIntervalId); servoIntervalId = null; }
    });

    window.addEventListener('blur', () => { resetAllKeys(); forceStopCar(); });

    function saveScreenshot() {
        if (!latestImageBitmap) return;
        const canvas = document.createElement('canvas');
        canvas.width = latestImageBitmap.width;
        canvas.height = latestImageBitmap.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(latestImageBitmap, 0, 0);

        const link = document.createElement('a');
        link.download = `ESPAuto_SNAP_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.92);
        link.click();
    }

    function toggleVideoRecording() { if (!isRecording) startVideoRecording(); else stopVideoRecording(); }

    function startVideoRecording() {
        if (!latestImageBitmap) return;
        recordedChunks = [];
        recordCanvas.width = latestImageBitmap.width;
        recordCanvas.height = latestImageBitmap.height;

        function syncRenderFrame() {
            if (!isRecording) return;
            if (latestImageBitmap) {
                canvasCtx.drawImage(latestImageBitmap, 0, 0, recordCanvas.width, recordCanvas.height);
            }
            recordCanvasId = requestAnimationFrame(syncRenderFrame);
        }
        isRecording = true;
        syncRenderFrame();

        const stream = recordCanvas.captureStream(30);
        let options = { mimeType: 'video/mp4;codecs=avc1.42E01E,mp4a.40.2' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/mp4' }; }
        if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = {}; }

        try { mediaRecorder = new MediaRecorder(stream, options); } catch (e) { mediaRecorder = new MediaRecorder(stream); }

        mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = `ESPAuto_REC_${Date.now()}.mp4`;
            a.href = url; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 100);
        };

        mediaRecorder.start(200);
        btnRecord.style.background = "rgba(255, 69, 58, 0.25)";
        btnRecord.style.borderColor = "rgba(255, 69, 58, 0.4)";
        lblRecord.innerText = i18nTokens[currentLang]['btnRecordStop'];
        recIndicator.style.display = 'flex';

        recordStartTime = Date.now();
        recordTimerInterval = setInterval(() => {
            const elapsedSec = Math.floor((Date.now() - recordStartTime) / 1000);
            const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
            const secs = String(elapsedSec % 60).padStart(2, '0');
            recTimer.innerText = `${mins}:${secs}`;
        }, 100);
    }

    function stopVideoRecording() {
        if (!isRecording) return;
        isRecording = false;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (recordCanvasId) cancelAnimationFrame(recordCanvasId);
        clearInterval(recordTimerInterval);

        btnRecord.style.background = "var(--bg-card-active)";
        btnRecord.style.borderColor = "var(--border-light)";
        lblRecord.innerText = i18nTokens[currentLang]['btnRecord'];
        recIndicator.style.display = 'none';
        recTimer.innerText = "00:00";
    }

    applyLanguage(currentLang);
</script>
</body>
